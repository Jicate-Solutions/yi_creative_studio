<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#aiGrad)"/>

  <!-- Decorative circles representing AI analysis -->
  <circle cx="200" cy="150" r="100" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="150" r="70" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="150" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- Sparkle/star at center representing AI -->
  <g transform="translate(200, 150)">
    <path d="M0,-20 L3,-7 L15,-10 L6,0 L15,10 L3,7 L0,20 L-3,7 L-15,10 L-6,0 L-15,-10 L-3,-7 Z"
          fill="url(#sparkGrad)" opacity="0.9"/>
  </g>

  <!-- Connection dots representing event detection -->
  <circle cx="120" cy="100" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="100" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="200" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="200" r="6" fill="#ffffff" opacity="0.6"/>

  <!-- Connection lines -->
  <line x1="120" y1="100" x2="200" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="280" y1="100" x2="200" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="200" x2="200" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="280" y1="200" x2="200" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <!-- Text placeholder -->
  <rect x="50" y="50" width="100" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="50" y="64" width="70" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
</svg>