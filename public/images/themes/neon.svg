<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#0f0f0f"/>
  <rect x="50" y="50" width="300" height="200" fill="none" stroke="#ff00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.8"/>
  <line x1="100" y1="80" x2="300" y2="80" stroke="#00ffff" stroke-width="3" filter="url(#neonGlow)" opacity="0.9"/>
  <circle cx="200" cy="150" r="40" fill="none" stroke="#ffff00" stroke-width="2" filter="url(#neonGlow)" opacity="0.7"/>
  <circle cx="200" cy="150" r="20" fill="none" stroke="#ff00ff" stroke-width="2" filter="url(#neonGlow)" opacity="0.8"/>
  <rect x="100" y="200" width="120" height="10" rx="5" fill="#00ffff" filter="url(#neonGlow)" opacity="0.9"/>
  <polygon points="320,100 340,130 320,160 300,130" fill="#ffff00" filter="url(#neonGlow)" opacity="0.6"/>
</svg>